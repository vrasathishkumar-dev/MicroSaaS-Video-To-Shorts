# Production-shaped local stack.
#
# The API and the worker run the same image and share the `uploads` volume:
# the worker writes rendered exports, the API streams them back out over
# /clips/{id}/download. Splitting them is the point -- ffmpeg renders never
# compete with request handling for CPU, and an API restart doesn't drop a
# job mid-encode.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-videotoshorts}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-videotoshorts}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["api"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-videotoshorts}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:5173","http://localhost:8080"]}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
      TRANSCRIPTION_API_KEY: ${TRANSCRIPTION_API_KEY:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["worker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-videotoshorts}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
      TRANSCRIPTION_API_KEY: ${TRANSCRIPTION_API_KEY:-}
      # Render quality knobs -- see .env.example / README.
      RENDER_CRF: ${RENDER_CRF:-18}
      RENDER_PRESET: ${RENDER_PRESET:-slow}
      RENDER_FRAMING: ${RENDER_FRAMING:-blur}
      RENDER_FPS: ${RENDER_FPS:-30}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        # The api role owns `alembic upgrade head`; wait for it so the
        # worker never queries a schema that doesn't exist yet.
        condition: service_started

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
  redisdata:
  uploads:
